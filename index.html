<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Feliz aniversário! 🎂</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff4d6;--ink:#3b1a4a;--pink:#ff5d8f;--mint:#5fd4b0;--sun:#ffc533;--card:#fff;--soft:#ffe6a8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a1236;--ink:#fff1d0;--card:#3d1c4d;--soft:#4b2560}}
:root[data-theme="dark"]{--bg:#2a1236;--ink:#fff1d0;--card:#3d1c4d;--soft:#4b2560}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Fredoka,"Trebuchet MS",sans-serif;line-height:1.6;overflow-x:hidden}
canvas{position:fixed;inset:0;pointer-events:none;z-index:10}
main{max-width:720px;margin:0 auto;padding:32px 20px 64px}
h1{font-size:clamp(2.6rem,11vw,4.6rem);line-height:1.05;margin:8px 0 12px;font-weight:700;text-align:center}
.sub{font-family:Caveat,cursive;font-size:1.7rem;text-align:center;color:var(--pink);margin:0}
.badge{display:block;width:max-content;margin:0 auto;background:var(--sun);color:#3b1a4a;padding:4px 16px;border-radius:99px;font-weight:600;transform:rotate(-3deg)}
.stage{text-align:center;margin:36px 0 12px}
.cake{width:min(280px,80vw);cursor:pointer;touch-action:manipulation}
.flame{transform-origin:50% 100%;animation:fl .5s infinite alternate ease-in-out}
.out .flame{display:none}
@keyframes fl{from{transform:scale(1) rotate(-4deg)}to{transform:scale(1.12,.92) rotate(4deg)}}
button{font:inherit;font-weight:600;background:var(--pink);color:#fff;border:0;border-radius:99px;padding:12px 26px;font-size:1.1rem;cursor:pointer;box-shadow:0 4px 0 #c23a68}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #c23a68}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
#reveal{display:none;margin-top:40px}
#reveal.show{display:block;animation:pop .6s ease-out}
@keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
.letter{background:var(--card);border-radius:28px;padding:28px 24px;border:3px solid var(--ink);box-shadow:8px 8px 0 var(--mint);font-size:1.15rem}
.letter p{margin:0 0 14px}
.sign{font-family:Caveat,cursive;font-size:1.9rem;color:var(--pink);margin:0}
h2{text-align:center;font-size:1.9rem;margin:44px 0 18px}
.reasons{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;padding:0;list-style:none}
.reasons li{background:var(--soft);border-radius:20px;padding:18px;font-weight:600}
.reasons li:nth-child(odd){transform:rotate(-1.5deg)}
.reasons li:nth-child(even){transform:rotate(1.5deg)}
.reasons span{font-size:1.8rem;display:block}
.counter{text-align:center;font-size:1.2rem;margin-top:36px}
.counter b{font-size:2rem;color:var(--pink)}
.ads{display:grid;gap:14px}
.ad{position:relative;border-radius:14px;padding:16px 40px 16px 16px;border:2px dashed var(--ink);background:var(--card);font-weight:600}
.ad small{position:absolute;left:12px;bottom:4px;font-size:.7rem;opacity:.6;font-weight:400}
.ad .x{position:absolute;top:6px;right:6px;width:26px;height:26px;padding:0;border-radius:6px;background:var(--soft);color:var(--ink);box-shadow:none;font-size:.9rem;line-height:1}
.ad strong{display:block;font-size:1.25rem}
.ad .fake{display:inline-block;margin-top:6px;background:var(--mint);color:#3b1a4a;padding:4px 14px;border-radius:8px;font-size:.95rem}
.ad.a1{background:#ffe0ec}.ad.a2{background:#d9f7ec}.ad.a3{background:#fff0b8}
.ad.a1,.ad.a2,.ad.a3{color:#3b1a4a}
.ad.love{background:var(--pink);color:#fff;border:3px solid var(--ink);text-align:center;padding:26px 16px 30px}
.ad.love strong{font-size:clamp(2rem,9vw,3rem);line-height:1.1}
.ad.love .x{background:#fff;color:#3b1a4a}
.ad.gone{display:none}
.shake{animation:sh .4s}
@keyframes sh{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
#toast{text-align:center;min-height:1.6em;margin:10px 0 0;font-weight:600;color:var(--pink)}
.finale{text-align:center;margin-top:48px}
.bubble{position:relative;display:inline-block;background:var(--card);border:3px solid var(--ink);border-radius:18px;padding:8px 18px;font-weight:600;margin-bottom:14px}
.bubble:after{content:"";position:absolute;left:50%;bottom:-12px;margin-left:-10px;border:10px solid transparent;border-top-color:var(--ink);border-bottom:0}

function burst(){
  var cols=["#ff5d8f","#ffc533","#5fd4b0","#8a5cff","#ff8a3d"];
  for(var i=0;i<160;i++){parts.push({x:innerWidth/2,y:innerHeight*0.4,vx:(Math.random()-.5)*16,vy:-Math.random()*14-4,r:Math.random()*6+3,c:cols[i%5],a:Math.random()*6,life:140+Math.random()*60})}
  if(!running){running=true;requestAnimationFrame(tick)}
}
function tick(){
  cx.clearRect(0,0,cv.width,cv.height);
  parts=parts.filter(function(p){return p.life>0});
  parts.forEach(function(p){p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.a+=.2;p.life--;
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillStyle=p.c;cx.fillRect(-p.r,-p.r/2,p.r*2,p.r);cx.restore()});
  if(parts.length){requestAnimationFrame(tick)}else{running=false}
}

function blow(){
  if($("stage").classList.contains("out")) { burst(); return }
  $("stage").classList.add("out");
  $("blow").textContent = "Soprar de novo 🎈";
  $("reveal").classList.add("show");
  burst();
  setTimeout(function(){$("reveal").scrollIntoView({behavior:"smooth",block:"start"})},700);
}
$("blow").addEventListener("click",blow);
$("cake").addEventListener("click",blow);
</script>
